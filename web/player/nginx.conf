# Rendered by the image entrypoint; only GOBY_API_UPSTREAM is substituted.
# Match the player's one-CPU deployment budget on hosts with many CPU cores.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Keep bearer credentials in media query strings out of access logs.
    log_format player '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout player;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Docker's embedded resolver observes a recreated backend container.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        set $goby_api_upstream "${GOBY_API_UPSTREAM}";

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }

        # Preserve the original API path, query, media ranges and WebSocket upgrade.
        location ~ ^/(?:emby(?:/|$)|embywebsocket$|admin(?:/|$)) {
            proxy_pass $goby_api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            client_max_body_size 0;
        }

        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location = /index.html {
            add_header Cache-Control "no-cache" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }
}
